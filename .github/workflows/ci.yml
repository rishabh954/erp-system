name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We might need a database container depending on the project setup,
    # but the project seems to be using sqlite3 locally by default.
    # If a postgres service is needed, it can be defined here.
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-django pytest-cov
        
    - name: Lint with Ruff
      run: |
        # Run ruff check on the whole repo
        ruff check .
        
    - name: Run Tests
      run: |
        pytest --cov=apps --cov=core
      env:
        DJANGO_SETTINGS_MODULE: config.settings
