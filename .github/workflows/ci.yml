name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-django pytest-cov mypy django-stubs
        
    - name: Lint with Ruff
      run: |
        # Run ruff check on the whole repo
        # Run ruff check on the whole repo
        ruff check .
        
    - name: Run Mypy
      run: |
        mypy apps core
        
    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DB_HOST: localhost
        DB_NAME: erp_test
        DB_USER: postgres
        DB_PASSWORD: postgres

    - name: Run Tests
      run: |
        pytest
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DB_HOST: localhost
        DB_NAME: erp_test
        DB_USER: postgres
        DB_PASSWORD: postgres

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit
    - name: Run pip-audit
      run: |
        # Explicitly ignoring CVE-2026-49452 (weasyprint) because no fix is available yet
        # and it is considered a known-accepted risk for now.
        IGNORES=(
          CVE-2026-49452
        )
        IGNORE_ARGS=""
        for vuln in "${IGNORES[@]}"; do
          IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln"
        done
        pip-audit -r requirements.txt --strict $IGNORE_ARGS
    - name: Run bandit
      run: |
        # Bandit is now enforced to block the pipeline on any security issues
        bandit -r apps core -x "*/tests/*,*/test_*.py,*tests.py" -s B101,B311
