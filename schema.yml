components:
  schemas:
    AbcClassificationEnum:
      enum:
      - A
      - B
      - C
      type: string
      description: |-
        * `A` - A-Class
        * `B` - B-Class
        * `C` - C-Class
    ActionEnum:
      enum:
      - login
      - logout
      - password_change
      - password_reset
      - profile_update
      - create
      - update
      - delete
      - view
      - export
      - import
      - approve
      - reject
      - failed_login
      type: string
      description: |-
        * `login` - Login
        * `logout` - Logout
        * `password_change` - Password Change
        * `password_reset` - Password Reset
        * `profile_update` - Profile Update
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `view` - View
        * `export` - Export
        * `import` - Import
        * `approve` - Approve
        * `reject` - Reject
        * `failed_login` - Failed Login
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_name:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        module:
          type: string
          maxLength: 50
        resource_type:
          type: string
          maxLength: 100
        description:
          type: string
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
      - user_name
    BOM:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        number:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          description: Quantity of finished product this BOM produces
        is_active:
          type: boolean
        deleted_by:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        company:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          description: The finished product
        routing:
          type: string
          format: uuid
          nullable: true
      required:
      - company
      - created_at
      - id
      - number
      - product
      - product_name
      - updated_at
    BOMRequest:
      type: object
      properties:
        is_deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          description: Quantity of finished product this BOM produces
        is_active:
          type: boolean
        deleted_by:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        product:
          type: string
          format: uuid
          description: The finished product
        routing:
          type: string
          format: uuid
          nullable: true
      required:
      - product
    BlankEnum:
      enum:
      - ''
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        total_leads_count:
          type: integer
          readOnly: true
        opportunities_count:
          type: integer
          readOnly: true
        won_count:
          type: integer
          readOnly: true
        actual_revenue_generated:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        roi_percentage:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/CampaignStatusEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        expected_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        deleted_by:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        company:
          type: string
          format: uuid
          readOnly: true
      required:
      - actual_revenue_generated
      - company
      - created_at
      - created_by
      - id
      - name
      - opportunities_count
      - roi_percentage
      - total_leads_count
      - updated_at
      - updated_by
      - won_count
    CampaignRequest:
      type: object
      properties:
        is_deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/CampaignStatusEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        expected_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        deleted_by:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    CampaignStatusEnum:
      enum:
      - planning
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `planning` - Planning
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    Contract:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        is_valid:
          type: boolean
          readOnly: true
        days_until_expiry:
          type: integer
          readOnly: true
        created_at:
