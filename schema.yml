openapi: 3.0.3
info:
  title: ERP System API
  version: 1.0.0
  description: Production-grade REST API for the ERP System. Authenticate via JWT
    Bearer token. All endpoints are company-scoped — data is automatically filtered
    to your organisation.
  contact:
    name: ERP Support
  license:
    name: Proprietary
