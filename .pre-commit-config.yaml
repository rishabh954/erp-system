repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: local
    hooks:
      - id: prevent-stray-scripts
        name: Prevent Stray Scripts
        entry: Stray scripts (scripts/fix_*, scripts/patch_*, scripts/temp_*) are not allowed outside scripts/maintenance/.
        language: fail
        files: ^(scripts/)?(fix_|patch_|temp_|patch|debug_).*\.py$
