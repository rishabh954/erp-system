{% extends "base.html" %}
{% block title %}Price Lists{% endblock %}
{% block content %}
<div class="page-header mb-4"><h1 class="h3 text-primary mb-1">Price Lists</h1></div>
<div class="card shadow-sm border-0"><table class="table table-hover mb-0" data-datatable data-datatable-options='{"searching": false}'>
<thead class="table-light"><tr><th>Name</th><th>Currency</th><th>Status</th></tr></thead>
<tbody>
{% for pl in price_lists %}<tr><td><a href="{% url 'sales:price_list_detail' pl.pk %}">{{ pl.name }}</a></td><td>{{ pl.currency }}</td><td>{{ pl.is_active|yesno:"Active,Inactive" }}</td></tr>
{% endfor %}
</tbody></table></div>
{% endblock %}
