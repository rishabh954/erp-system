{% extends "base.html" %}
{% block title %}Credit Notes{% endblock %}
{% block content %}
<div class="page-header mb-4"><h1 class="h3 text-primary mb-1">Credit Notes</h1></div>
<div class="card shadow-sm border-0"><table class="table table-hover mb-0" data-datatable data-datatable-options='{"searching": false}'>
<thead class="table-light"><tr><th>Number</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
<tbody>
{% for cn in credit_notes %}<tr><td><a href="{% url 'sales:credit_note_detail' cn.pk %}">{{ cn.number }}</a></td><td>{{ cn.customer.name }}</td><td>{{ cn.date }}</td><td>{{ cn.amount }}</td><td>{{ cn.get_status_display }}</td></tr>
{% endfor %}
</tbody></table></div>
{% endblock %}
