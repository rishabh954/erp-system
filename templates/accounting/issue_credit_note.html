{% extends "base.html" %}
{% block title %}Issue Credit Note{% endblock %}
{% block nav_accounting %}active{% endblock %}
{% block content %}
<h1 class="h3 mb-4 text-gray-800">Issue Credit Note</h1>

<div class="row">
    <div class="col-lg-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Customer</label>
                        <select name="customer" class="form-select" required>
                            <option value="">-- Select Customer --</option>
                            {% for c in customers %}
                            <option value="{{ c.pk }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Related Invoice (Optional)</label>
                        <select name="invoice" class="form-select">
                            <option value="">-- None --</option>
                            {% for i in invoices %}
                            <option value="{{ i.pk }}">{{ i.number }} ({{ i.customer.name }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Credit Amount</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Reason / Notes</label>
                        <textarea name="reason" class="form-control" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Credit Note</button>
                    <a href="{% url 'accounting:chart_of_accounts' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
