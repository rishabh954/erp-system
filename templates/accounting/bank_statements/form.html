{% extends "base.html" %}
{% block title %}Import Bank Statement{% endblock %}
{% block content %}
<div class="page-header mb-4 d-flex justify-content-between align-items-center">
    <h1 class="h3 text-primary mb-1">Import Bank Statement</h1>
    <a href="{% url 'accounting:statement_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
</div>
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Bank Account</label>
                        <select name="bank_account" class="form-select" required>
                            <option value="">Select Account...</option>
                            {% for acc in form.bank_accounts %}
                            <option value="{{ acc.id }}">{{ acc.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Starting Balance</label>
                        <input type="number" step="0.01" name="starting_balance" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ending Balance</label>
                        <input type="number" step="0.01" name="ending_balance" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Statement File (CSV/OFX)</label>
                        <input type="file" name="file" class="form-control" accept=".csv, .ofx" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Upload & Analyze</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
