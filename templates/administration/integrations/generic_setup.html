{% extends "base.html" %}
{% block title %}Generic Setup{% endblock %}
{% block content %}
<div class="page-header mb-4">
    <h1 class="h3 text-primary mb-1">Generic Setup</h1>
</div>
<div class="card shadow-sm border-0 glass-card">
    <div class="card-body">
        <h5 class="card-title text-muted">Manage Generic Setup</h5>
        <div class="table-responsive mt-3">
            <table class="table table-hover">
                <thead>
                    <tr><th>Item</th></tr>
                </thead>
                <tbody>
                    {% for item in setup %}
                    <tr><td>{{ item }}</td></tr>
                    {% empty %}
                    <tr><td class="text-muted">No records found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
