{% extends "base.html" %}

{% block title %}Delete Category{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow border-danger border-top border-4 glass-card">
      <div class="card-body p-4 text-center">
        <div class="mb-4">
          <div class="icon-circle bg-danger-subtle text-danger mx-auto" style="width: 80px; height: 80px; font-size: 2rem;">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
        </div>
        
        <h3 class="fw-bold mb-3">Delete Category?</h3>
        <p class="text-muted mb-4">
          Are you sure you want to delete the category <strong>"{{ object.name }}"</strong>? 
          This action cannot be undone.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'inventory:categories' %}" class="btn btn-light px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">
              <i class="fas fa-trash me-2"></i>Yes, Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
