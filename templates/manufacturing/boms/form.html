{% extends "base.html" %}
{% block title %}New BOM{% endblock %}
{% block content %}
<h2>New Bill of Material</h2>
<form method="post" class="card shadow p-4">
    {% csrf_token %}
    <div class="mb-3">
        <label>Finished Product</label>
        <select name="product" class="form-select" required>
            {% for p in products %}
            <option value="{{ p.pk }}">{{ p.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>Quantity</label>
        <input type="number" name="quantity" class="form-control" value="1" step="0.01" required>
    </div>
    <div class="mb-3">
        <label>Routing</label>
        <select name="routing" class="form-select">
            <option value="">-- None --</option>
            {% for r in routings %}
            <option value="{{ r.pk }}">{{ r.name }}</option>
            {% endfor %}
        </select>
    </div>
    <hr>
    <h4>Components</h4>
    <div id="components">
        <div class="row mb-2">
            <div class="col">
                <select name="component_id[]" class="form-select">
                    <option value="">-- Select --</option>
                    {% for p in products %}
                    <option value="{{ p.pk }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col"><input type="number" name="line_quantity[]" class="form-control" placeholder="Qty" step="0.01" value="1"></div>
            <div class="col"><input type="number" name="scrap_percentage[]" class="form-control" placeholder="Scrap %" step="0.01" value="0"></div>
        </div>
    </div>
    <button type="button" class="btn btn-secondary btn-sm mb-3" onclick="document.getElementById('components').insertAdjacentHTML('beforeend', document.querySelector('#components .row').outerHTML);">Add Component</button>
    <br>
    <button type="submit" class="btn btn-primary">Save BOM</button>
</form>
{% endblock %}
