<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Enterprise ERP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f8f9fa; color: #333; margin: 0; }
        .container { text-align: center; max-width: 600px; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #4361ee; }
        p { font-size: 1.2rem; color: #6c757d; margin-bottom: 2rem; }
        .btn { padding: 0.75rem 1.5rem; background-color: #4361ee; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn:hover { background-color: #3f37c9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
        <a href="javascript:window.location.reload();" class="btn">Retry Connection</a>
    </div>
</body>
</html>
