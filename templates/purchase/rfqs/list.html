{% extends "base.html" %}
{% block title %}RFQs{% endblock %}
{% block content %}
<div class="page-header mb-4"><h1 class="h3 text-primary mb-1">Requests for Quotation</h1></div>
<div class="card shadow-sm border-0"><table class="table table-hover mb-0">
<thead class="table-light"><tr><th>Number</th><th>Title</th><th>Deadline</th><th>Status</th></tr></thead>
<tbody>
{% for rfq in rfqs %}<tr><td><a href="{% url 'purchase:rfq_detail' rfq.pk %}">{{ rfq.number }}</a></td><td>{{ rfq.title }}</td><td>{{ rfq.deadline }}</td><td>{{ rfq.get_status_display }}</td></tr>
{% empty %}<tr><td colspan="4" class="text-center py-4">No RFQs found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
