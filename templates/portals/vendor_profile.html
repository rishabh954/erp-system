{% extends "base.html" %}
{% block title %}Vendor Profile{% endblock %}
{% block content %}
<div class="page-header mb-4">
    <h1 class="h3 text-primary mb-1">Vendor Profile</h1>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control bg-light" value="{{ vendor.name }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control bg-light" value="{{ vendor.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ vendor.phone }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bank Details</label>
                        <textarea name="bank_details" class="form-control" rows="3">{{ vendor.bank_details|default:"" }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
