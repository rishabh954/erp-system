{% extends "portals/portal_base.html" %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block nav_profile %}active{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <div class="card-title">Company Information</div>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Vendor Name</label>
                <input type="text" class="form-control bg-light" value="{{ vendor.name }}" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Vendor Code</label>
                <input type="text" class="form-control bg-light" value="{{ vendor.vendor_code }}" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Contact Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ vendor.phone|default:'' }}">
            </div>
            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
